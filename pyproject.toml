[project]
name = "trustmap"
version = "0.1.0"
description = "COE750: Should the Robot Trust Its Map? 2D simulator and experiments."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Point 7: Gymnasium environment and MaskablePPO training (CPU only).
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trustmap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
